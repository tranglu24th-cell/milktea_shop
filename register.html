<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="utf-8">
    <title>Đăng ký - Milk Tea Shop</title>
    <meta content="width=device-width, initial-scale=1.0" name="viewport">

    <link href="css/bootstrap.min.css" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">

    <style>
        body {
            background-color: #f8f9fa;
        }

        .register-container {
            max-width: 450px;
            margin: 50px auto;
            padding: 30px;
            background: #fff;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
        }

        .btn-primary {
            background-color: #32E0C4; /* Màu xanh đặc trưng của quán trà sữa */
            border: none;
            transition: 0.3s;
        }

            .btn-primary:hover {
                background-color: #28b8a0;
                transform: translateY(-2px);
            }

        .form-label {
            font-weight: 600;
            color: #555;
        }

        .logo-text {
            color: #32E0C4;
            font-weight: bold;
            font-size: 24px;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="register-container">
            <div class="text-center mb-4">
                <h1 class="logo-text">Milk Tea Shop</h1>
                <h4 class="text-dark">Tạo tài khoản mới</h4>
                <p class="text-muted">Đăng ký để nhận nhiều ưu đãi hấp dẫn</p>
            </div>

            <form id="registerForm">
                <div class="mb-3">
                    <label class="form-label">Họ và tên</label>
                    <input type="text" class="form-control" id="fullname"  required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Email</label>
                    <input type="email" class="form-control" id="email" required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Mật khẩu</label>
                    <input type="password" class="form-control" id="password"  required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Xác nhận mật khẩu</label>
                    <input type="password" class="form-control" id="confirmPassword"  required>
                </div>

                <div class="mb-3 form-check">
                    <input type="checkbox" class="form-check-input" id="terms" required>
                    <label class="form-check-label" for="terms">Tôi đồng ý với các điều khoản dịch vụ</label>
                </div>

                <button type="button" onclick="handleRegister()" class="btn btn-primary w-100 py-2 shadow-sm">
                    Đăng Ký Ngay
                </button>
            </form>

            <div class="text-center mt-4">
                <p class="mb-0">Đã có tài khoản? <a href="login.html" class="text-primary text-decoration-none">Đăng nhập tại đây</a></p>
                <hr>
                <a href="index.html" class="text-muted small text-decoration-none">
                    <i class="fa fa-arrow-left"></i> Quay về trang chủ
                </a>
            </div>
        </div>
    </div>

    <script>
        function handleRegister() {
            // Lấy dữ liệu (chỉ để demo)
            const name = document.getElementById('fullname').value;
            const email = document.getElementById('email').value;

            if (name === "" || email === "") {
                alert("Vui lòng nhập đầy đủ họ tên và email!");
                return;
            }

            // Thông báo thành công
            alert("Chúc mừng " + name + " đã đăng ký thành công!\nHệ thống sẽ chuyển bạn về trang Đăng nhập.");

            // Chuyển hướng về trang đăng nhập để demo tiếp luồng công việc
            window.location.href = "login.html";
        }
    </script>

</body>
</html>
