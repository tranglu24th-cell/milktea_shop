<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="utf-8">
    <title>Đăng nhập - Milk Tea Shop</title>
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <link href="css/bootstrap.min.css" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
    <style>
        .login-container {
            max-width: 400px;
            margin: 100px auto;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 0 20px rgba(0,0,0,0.1);
        }

        .btn-primary {
            background-color: #32E0C4;
            border: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="login-container bg-white">
            <h2 class="text-center mb-4">Đăng Nhập</h2>
            <form>
                <div class="mb-3">
                    <label class="form-label">Email / Số điện thoại</label>
                    <input type="email" class="form-control" placeholder="admin@gmail.com">
                </div>
                <div class="mb-3">
                    <label class="form-label">Mật khẩu</label>
                    <input type="password" class="form-control" placeholder="******">
                </div>
                <div class="mb-3 form-check">
                    <input type="checkbox" class="form-check-input" id="remember">
                    <label class="form-check-label" for="remember">Ghi nhớ đăng nhập</label>
                </div>
                <button type="button" onclick="handleLogin()" class="btn btn-primary w-100 py-2">Đăng Nhập</button>
            </form>
            <div class="text-center mt-3">
                <p>Chưa có tài khoản? <a href="register.html">Đăng ký ngay</a></p>
                <a href="index.html">Quay về trang chủ</a>
            </div>
        </div>
    </div>

    <script>
        function handleLogin() {
            alert("Đăng nhập thành công với quyền Admin!");
            window.location.href = "admin/index.html";
        }
    </script>
</body>
</html>
